
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>写真と短歌</title>

<style>
body {
    background-image: url("note01.gif");
    background-repeat: repeat;
    background-color: #ffffcc;
    text-align: center;
    margin: 15px;
}

img {
    width: 800px;
    height: auto;
}

button {
    font-size: 18px;
    margin: 5px;
    padding: 5px 12px;
}
</style>
</head>

<body>

<div>
    <button onclick="changePhoto(-1)">前へ</button>
    <button onclick="window.close()">終了</button>
    <button onclick="changePhoto(1)">次へ</button>
</div>

<p id="number"></p>

<img id="photo" src="" alt="写真と短歌">

<script>

// 写真のファイル名をここに並べる
const photos = [
    "01.jpg",
    "02.jpg",
    "03.jpg",
    "04.jpg",
    "05.jpg",
    "06.jpg",
    "07.jpg",
    "08.jpg",
    "09.jpg",
    "10.jpg",
    "11.jpg",
    "12.jpg",
    "13.jpg",
    "14.jpg",
    "15.jpg",
    "16.jpg",
    "17.jpg",
    "18.jpg",
    "19.jpg",
    "20.jpg",
    "21.jpg",
    "22.jpg",
    "23.jpg"
];

let current = 0;

function showPhoto() {
    document.getElementById("photo").src =
        photos[current];

    document.getElementById("number").textContent =
        (current + 1) + " / " + photos.length;
}

function changePhoto(step) {
    current = current + step;

    if (current < 0) {
        current = photos.length - 1;
    }

    if (current >= photos.length) {
        current = 0;
    }

    showPhoto();
}

showPhoto();

</script>

</body>
</html>
