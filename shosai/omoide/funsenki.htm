  body { margin:0; background: #fff8e4 url("note01.gif") repeat; color:#663300; font-family:"Yu Mincho","Hiragino Mincho ProN","MS PMincho",serif; }
  main { max-width: 900px; margin:0 auto; padding:24px 24px 20px; text-align:center; }
  h1 { margin: 0 0 6px; }
  .subtitle { font-size:18px; margin:0 0 18px; letter-spacing:.07em; }
  nav { display:flex; flex-direction:column; gap:9px; max-width:335px; margin:0 auto 17px; }
  .menu { display:flex; align-items:center; justify-content:center; min-height:45px; padding:5px 12px; text-decoration:none; color:#fff6df; font-family:"Yu Mincho","MS PMincho",serif; font-size:clamp(19px,2.5vw,24px); font-weight:bold; letter-spacing:.12em; border:3px solid #c59b50; border-radius:12px; background:linear-gradient(115deg,#112c50,#24517b 50%,#102946); box-shadow:0 5px 10px #59401c55,inset 0 0 0 2px #e9cb87; transition:transform .15s, filter .15s; }
  .menu:hover,.menu:focus-visible { transform:translateY(-2px); filter:brightness(1.2); }
  .menu span { color:#ffd780; margin-left:0.3em; }
  .back { font-size:20px; }
  .menu.completed { background:linear-gradient(115deg,#666,#888 50%,#666); border-color:#aaa; box-shadow:0 3px 6px #5555; }
  .menu.completed span { color:#fff; }
</style>
<script>
function openEgypt(number) {
  const url = 'seishun_egypt/no' + number + '/egypt_viewer.htm';
  const width = Math.min(1200, screen.availWidth);
  const height = Math.min(1000, screen.availHeight);
  const left = Math.max(0, Math.round((screen.availWidth - width) / 2 + (screen.availLeft || 0)));
  const top = Math.max(0, Math.round((screen.availHeight - height) / 2 + (screen.availTop || 0)));
  const win = window.open(url, 'egyptPhotos' + number,
    'width=' + width + ',height=' + height + ',left=' + left + ',top=' + top + ',resizable=yes,scrollbars=yes');
  if (win) {
    win.focus();
    return false;
  }
  return true; // ポップアップが禁止されている場合は通常のリンクで開く
}
const EGYPT_LAST_VIEWED = 'egypt-last-viewed-at';
const EGYPT_RESET_AFTER = 7 * 24 * 60 * 60 * 1000;
function resetExpiredEgyptHistory() {
  try {
    const last = Number(localStorage.getItem(EGYPT_LAST_VIEWED));
    if (last > 0 && (Date.now() - last >= EGYPT_RESET_AFTER || Date.now() < last)) {
      for (let i = 1; i <= 10; i++) localStorage.removeItem('egypt-complete-' + i);
      localStorage.removeItem(EGYPT_LAST_VIEWED);
    }
  } catch(e) {}
}
function refreshCompleted() {
  resetExpiredEgyptHistory();
  document.querySelectorAll('a.menu').forEach((link, i) => {
    let done = false;
    try { done = localStorage.getItem('egypt-complete-' + (i + 1)) === 'yes'; } catch(e) {}
    link.classList.toggle('completed', done);
    link.setAttribute('aria-label', 'エジプト奮戦記 NO' + (i + 1) + (done ? ' 閲覧済み' : ''));
  });
}
window.addEventListener('pageshow', refreshCompleted);
window.addEventListener('focus', refreshCompleted);
window.addEventListener('storage', refreshCompleted);
</script>
