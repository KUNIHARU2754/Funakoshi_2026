<script>
function openEgypt(number) {
  const url = 'seishun_egypt/no' + number + '/egypt_viewer.htm';
  const width = Math.min(1200, screen.availWidth);
  const height = Math.min(1000, screen.availHeight);
  const left = Math.max(0, Math.round((screen.availWidth - width) / 2 + screen.availLeft));
  const top = Math.max(0, Math.round((screen.availHeight - height) / 2 + screen.availTop));
  const win = window.open(url, 'egyptPhotos' + number,
    'width=' + width + ',height=' + height + ',left=' + left + ',top=' + top + ',resizable=yes,scrollbars=yes');
  if (win) { win.focus(); return false; }
  return true;
}
</script>
