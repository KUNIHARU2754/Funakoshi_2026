<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>エジプト奮戦記 写真</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff8e4 url("../../note01.gif") repeat;color:#663300;font-family:"Yu Mincho","MS PMincho",serif}
header{position:sticky;top:0;z-index:10;background:#fff8e4 url("../../note01.gif") repeat;border:0!important;box-shadow:none!important;outline:0!important;padding:10px;text-align:center}
.controls{display:flex;justify-content:center;align-items:center;gap:15px;flex-wrap:wrap}
button{min-width:115px;padding:8px 15px;border:2px solid #c59b50;border-radius:9px;background:#173d65;color:white;font-size:19px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#label{font-size:19px;font-weight:bold}
main{text-align:center;padding:12px}
#photo{display:block;max-width:100%;max-height:calc(100vh - 115px);width:auto;height:auto;margin:auto;object-fit:contain}
#message{margin:12px;font-size:18px}
header::before,header::after{display:none!important;border:0!important} .controls{border:0!important;box-shadow:none!important} main{border-top:0!important}
</style>
</head>
<body>
<header><div class="controls"><button id="prev" onclick="move(-1)">◀ 戻る</button><button onclick="window.close()">✕ 閉じる</button><button onclick="move(1)">次へ ▶</button><span id="label"></span></div></header>
<main><img id="photo" alt="エジプトの写真"><p id="message" role="status"></p></main>
<script>
const params=new URLSearchParams(location.search);
const folder=location.pathname.match(/\/no([1-9]\d?)\/egypt_viewer\.htm$/i);
const no=folder ? Number(folder[1]) : 1;
let index=1;
const photo=document.getElementById('photo');
const message=document.getElementById('message');
const label=document.getElementById('label');
const prev=document.getElementById('prev');
const EGYPT_LAST_VIEWED = 'egypt-last-viewed-at';
const EGYPT_RESET_AFTER = 7 * 24 * 60 * 60 * 1000;
function resetExpiredEgyptHistory() {
  try {
    const last = Number(localStorage.getItem(EGYPT_LAST_VIEWED));
    if (last > 0 && (Date.now() - last >= EGYPT_RESET_AFTER || Date.now() < last)) {
      for (let i = 1; i <= 10; i++) localStorage.removeItem('egypt-complete-' + i);
      localStorage.removeItem(EGYPT_LAST_VIEWED);
    }
  } catch(e) {}
}
resetExpiredEgyptHistory();

function filename(n){return String(n).padStart(3,'0')+'.jpg';}
function show(n){
  if(n<1)return;
  const test=new Image();
  message.textContent='読み込み中…';
  test.onload=()=>{try { localStorage.setItem(EGYPT_LAST_VIEWED, String(Date.now())); } catch(e) {} index=n;photo.src=test.src;photo.style.display='block';message.textContent='';label.textContent='NO'+no+'　写真 '+String(index).padStart(3,'0');prev.disabled=index===1;};
  test.onerror=()=>{
    if(n===index+1 && index>=1){
      try { localStorage.setItem('egypt-complete-' + no, 'yes'); } catch(e) {}
      message.textContent='NO'+no+' は最後までご覧いただきました。目次のボタンが灰色になります。';
      try { if(window.opener && !window.opener.closed && window.opener.refreshCompleted) window.opener.refreshCompleted(); } catch(e) {}
    } else {
      message.textContent=n===1?'001.jpg が見つかりません。写真のファイル名を確認してください。':'写真 '+String(n).padStart(3,'0')+'.jpg は見つかりません。';
    }
  };
  test.src=filename(n);
}
function move(delta){show(index+delta);}
label.textContent='NO'+no;prev.disabled=true;show(1);
</script>
</body>
</html>
